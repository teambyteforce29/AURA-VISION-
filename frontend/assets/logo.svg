<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Primary Aura Gradient -->
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Structural Gold / Warning Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Core Eye Gradient -->
    <radialGradient id="coreGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="70" fill="url(#glowGrad)"/>

  <!-- Outer Tech Hexagon Shield -->
  <polygon points="80,14 137,47 137,113 80,146 23,113 23,47" 
           fill="none" 
           stroke="url(#auraGrad)" 
           stroke-width="3" 
           stroke-linejoin="round"
           filter="url(#subtleGlow)"/>

  <!-- Inner Concentric Orbit -->
  <circle cx="80" cy="80" r="48" 
          fill="none" 
          stroke="#94A3B8" 
          stroke-opacity="0.3" 
          stroke-width="1.5" 
          stroke-dasharray="4 4"/>

  <!-- Infrastructure Bridge / Beam Chevron Truss -->
  <!-- Left Pillar Support -->
  <path d="M 46 113 L 80 44 L 114 113" 
        fill="none" 
        stroke="url(#auraGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Structural Cross-Bracing / Beam -->
  <path d="M 58 88 L 102 88" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Secondary Truss Web -->
  <path d="M 68 113 L 80 88 L 92 113" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        stroke-opacity="0.8"/>

  <!-- Central Vision Lens / Pupil (The AURA Sensor) -->
  <circle cx="80" cy="65" r="14" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <circle cx="80" cy="65" r="8" fill="url(#coreGrad)"/>
  <circle cx="77" cy="62" r="2.5" fill="#FFFFFF"/>

  <!-- Scanning Target Crosshairs -->
  <line x1="80" y1="24" x2="80" y2="34" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="126" x2="80" y2="136" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="33" y1="80" x2="43" y2="80" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="117" y1="80" x2="127" y2="80" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Corner Reticle Dots -->
  <circle cx="48" cy="48" r="2" fill="#38BDF8" opacity="0.7"/>
  <circle cx="112" cy="48" r="2" fill="#38BDF8" opacity="0.7"/>
  <circle cx="48" cy="112" r="2" fill="#38BDF8" opacity="0.7"/>
  <circle cx="112" cy="112" r="2" fill="#38BDF8" opacity="0.7"/>
</svg>
